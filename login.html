<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | GreenLife Nursery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="login-image">

            <div class="login-overlay">

                <div class="login-brand">
                    🌿 GreenLife
                </div>

                <h1>
                    Bring Nature<br>
                    Into Your Life
                </h1>

                <p>
                    Discover beautiful plants and create
                    your own peaceful green space.
                </p>

            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="login-box">

            <div class="login-header">

                <div class="login-logo">
                    🌱
                </div>

                <h2>Welcome Back!</h2>

                <p>
                    Login to your GreenLife account
                </p>

            </div>


            <form id="loginForm" novalidate>

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >

                    <small
                        class="form-error"
                        id="emailError">
                    </small>

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword()">
                            👁
                        </button>

                    </div>

                    <small
                        class="form-error"
                        id="passwordError">
                    </small>

                </div>


                <!-- REMEMBER -->
                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>

                    <a href="#" onclick="forgotPassword(event)">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="login-btn">
                    Login
                </button>


                <!-- GENERAL ERROR -->
                <div
                    id="loginMessage"
                    class="login-message">
                </div>

            </form>


            <div class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </div>


            <div class="back-home">

                <a href="index.html">
                    ← Back to GreenLife
                </a>

            </div>

        </div>

    </div>


    <script src="login.js"></script>

</body>
</html>
